<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הניוזלטר לאתר</title>
<style>
  :root { --bg:#F2F4F8; --panel:#FFFFFF; --fg:#141A2E; --muted:#5B6280; --line:#D8DCE6; --ok:#127A4B; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0E1424; --panel:#172038; --fg:#EEF1F8; --muted:#A9B1CC; --line:#2B3657; --ok:#4ED19A; } }
  :root[data-theme="dark"] { --bg:#0E1424; --panel:#172038; --fg:#EEF1F8; --muted:#A9B1CC; --line:#2B3657; --ok:#4ED19A; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:28px 16px 40px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 22px; font-size:15px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:14px; }
  .name { font-weight:800; font-size:17px; margin-bottom:12px; }
  button { width:100%; border:0; border-radius:10px; padding:16px; font-size:17px; font-weight:800; cursor:pointer; background:#F0C000; color:#1D2E67; }
  .done { background:var(--ok) !important; color:#fff !important; }
  ol { margin:0; padding-inline-start:20px; color:var(--muted); font-size:14px; line-height:1.7; }
</style>
</head>
<body>
<main>
  <h1>הניוזלטר לאתר</h1>
  <p class="sub">כל גיליון בלחיצה אחת, מוכן להדבקה בעמוד באתר.</p>
  <div id="list"></div>
  <div class="card">
    <ol>
      <li>לוחצים על הכפתור של הגיליון.</li>
      <li>באתר פותחים עמוד חדש, ומדביקים בבלוק HTML (קוד מותאם אישית).</li>
      <li>אין בו "הסרה מהתפוצה" והקישורים ישירים, כי זה עמוד באתר ולא מייל.</li>
    </ol>
  </div>
</main>
<script type="application/json" id="data">{{DATA}}</script>
<script>
  const items = JSON.parse(document.getElementById('data').textContent);
  const list = document.getElementById('list');
  async function copy(text, btn, label) {
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.append(t); t.select(); document.execCommand('copy'); t.remove();
    }
    btn.textContent = 'הועתק ✓'; btn.classList.add('done');
    setTimeout(() => { btn.textContent = label; btn.classList.remove('done'); }, 2500);
  }
  items.forEach((it) => {
    const card = document.createElement('div'); card.className = 'card';
    const name = document.createElement('div'); name.className = 'name'; name.textContent = it.title;
    const label = 'העתקת ה-HTML לאתר';
    const btn = document.createElement('button'); btn.textContent = label;
    btn.onclick = () => copy(it.html, btn, label);
    card.append(name, btn); list.append(card);
  });
</script>
</body>
</html>
