<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · מיילצ'ימפ</title>
<style>
  :root { --bg:#F2F4F8; --panel:#FFFFFF; --fg:#141A2E; --muted:#5B6280; --line:#D8DCE6; --navy:#1D2E67; --gold:#F0C000; --ok:#127A4B; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0E1424; --panel:#172038; --fg:#EEF1F8; --muted:#A9B1CC; --line:#2B3657; --navy:#8FA8FF; --ok:#4ED19A; } }
  :root[data-theme="dark"] { --bg:#0E1424; --panel:#172038; --fg:#EEF1F8; --muted:#A9B1CC; --line:#2B3657; --navy:#8FA8FF; --ok:#4ED19A; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:28px 16px 40px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 22px; font-size:15px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:14px; }
  .label { font-size:13px; color:var(--muted); margin-bottom:8px; }
  .subject { font-weight:700; font-size:16px; margin-bottom:12px; word-break:break-word; }
  button { width:100%; border:0; border-radius:10px; padding:16px; font-size:17px; font-weight:800; cursor:pointer; background:var(--gold); color:#1D2E67; }
  button.secondary { background:transparent; border:2px solid var(--navy); color:var(--navy); padding:12px; font-size:15px; }
  .done { background:var(--ok) !important; color:#fff !important; border-color:var(--ok) !important; }
  ol { margin:0; padding-inline-start:20px; color:var(--muted); font-size:14px; line-height:1.7; }
  .size { font-size:12px; color:var(--muted); margin-top:8px; text-align:center; }
</style>
</head>
<body>
<main>
  <h1>{{TITLE}}</h1>
  <p class="sub">ה-HTML המלא למיילצ'ימפ, בלחיצה אחת.</p>

  <div class="card">
    <button id="copyHtml">העתקת ה-HTML למיילצ'ימפ</button>
    <div class="size" id="size"></div>
  </div>

  <div class="card">
    <div class="label">שורת הנושא</div>
    <div class="subject" id="subject"></div>
    <button class="secondary" id="copySubject">העתקת שורת הנושא</button>
  </div>

  <div class="card">
    <div class="label">איך מדביקים</div>
    <ol>
      <li>במיילצ'ימפ: Create ← Email ← Code your own ← Paste in code.</li>
      <li>מוחקים את מה שיש שם, ומדביקים.</li>
      <li>בהגדרות הקמפיין מדביקים את שורת הנושא.</li>
    </ol>
  </div>
</main>
<script type="application/json" id="data">{{DATA}}</script>
<script>
  const data = JSON.parse(document.getElementById('data').textContent);
  document.getElementById('subject').textContent = data.subject;
  document.getElementById('size').textContent = Math.round(data.html.length / 1000) + ' אלף תווים';
  async function copy(text, btn, label) {
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.append(t); t.select(); document.execCommand('copy'); t.remove();
    }
    btn.textContent = 'הועתק ✓'; btn.classList.add('done');
    setTimeout(() => { btn.textContent = label; btn.classList.remove('done'); }, 2500);
  }
  const h = document.getElementById('copyHtml'), s = document.getElementById('copySubject');
  h.onclick = () => copy(data.html, h, 'העתקת ה-HTML למיילצ\'ימפ');
  s.onclick = () => copy(data.subject, s, 'העתקת שורת הנושא');
</script>
</body>
</html>
