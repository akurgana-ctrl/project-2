<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<base target="_top">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&family=Karantina:wght@700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#E9ECF3;font-family:'Heebo',Arial,sans-serif;color:#141A2E}
  .card{max-width:480px;margin:0 auto;background:#fff;min-height:100vh}
  .top{background:#1D2E67;padding:22px 24px;border-bottom:6px solid #F0C000;color:#fff;font-weight:900;font-size:15px}
  .body{padding:28px 24px;display:grid;gap:14px}
  h1{margin:0;font-family:'Karantina','Heebo',Arial,sans-serif;font-size:56px;line-height:.95;color:#1D2E67}
  .choice{background:#F2F4F8;border-right:4px solid #F0C000;padding:12px 14px;font-weight:700}
  p{margin:0;font-size:16px;line-height:1.6}
  .btn{display:block;text-align:center;background:#F0C000;color:#1D2E67;font-weight:900;font-size:18px;padding:16px;text-decoration:none}
  .muted{color:#596079;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <div class="top">כח התערבות · קבוצת לחץ ציבורי</div>
  <div class="body">
    <? if (option) { ?>
      <h1 id="title">רושמים את הקול שלך…</h1>
      <div class="choice">הבחירה שלך: <?= label ?></div>
      <p>את התוצאות נפרסם ביום ראשון בקבוצת הלחץ. שם גם נצא לדרך עם הנושא שנבחר.</p>
      <a class="btn" href="<?= groupUrl ?>">הצטרפות לקבוצת לחץ</a>
      <p class="muted">אפשר לסגור את הדף ולחזור למייל.</p>
    <? } else { ?>
      <h1>משהו השתבש</h1>
      <p>לא הצלחנו לזהות את האפשרות שבחרת. חזרו למייל ולחצו שוב על אחת מאפשרויות ההצבעה.</p>
    <? } ?>
  </div>
</div>
<? if (option) { ?>
<script>
  google.script.run
    .withSuccessHandler(function (ok) {
      document.getElementById('title').textContent = ok ? 'תודה! הקול שלך נספר' : 'משהו השתבש';
    })
    .withFailureHandler(function () {
      document.getElementById('title').textContent = 'לא הצלחנו לרשום את הקול. נסו שוב בעוד רגע.';
    })
    .record(<?!= JSON.stringify(option) ?>, <?!= JSON.stringify(id) ?>);
</script>
<? } ?>
</body>
</html>
