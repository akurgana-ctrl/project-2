<title>יומן כוח התערבות</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;600&display=swap">
<style>
/* Layout: one calm RTL column, like a printed task sheet; numbers in a narrow right margin */
:root {
  --bg: #f6f8fa;
  --surface: #ffffff;
  --ink: #16212e;
  --muted: #5d6b7a;
  --line: #dde3ea;
  --accent: #1f4e79;
  --done: #8a96a3;
  --display: "Frank Ruhl Libre", "David", Georgia, serif;
  --body: "Heebo", "Arial Hebrew", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --surface: #171e26; --ink: #e6ebf0; --muted: #98a5b3;
    --line: #2a3440; --accent: #8db8e3; --done: #6b7785; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #171e26; --ink: #e6ebf0; --muted: #98a5b3;
  --line: #2a3440; --accent: #8db8e3; --done: #6b7785; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.6;
  padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 720px; margin: 0 auto; display: grid; gap: 40px; }
header { display: grid; gap: 4px; border-bottom: 2px solid var(--ink); padding-bottom: 16px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 2.1rem; line-height: 1.15; margin: 0; text-wrap: balance; }
.updated { color: var(--muted); font-size: 0.9rem; }
.sec { display: grid; gap: 8px; }
h2 {
  font-family: var(--display); font-weight: 500; font-size: 1.35rem; margin: 0;
  display: flex; align-items: baseline; gap: 10px;
}
.count { font-family: var(--body); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.item { display: flex; gap: 14px; padding: 14px 16px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.num { flex: 0 0 1.6em; color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
.body { flex: 1; min-width: 0; display: grid; gap: 6px; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
.title { font-weight: 600; }
.title strong { font-weight: 600; }
.meta { color: var(--muted); font-size: 0.85rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.subs { margin: 0; padding-right: 18px; color: var(--ink); font-size: 0.95rem; display: grid; gap: 2px; }
.subs li::marker { color: var(--muted); }
.subs li.done { color: var(--done); }
.sec-note .title, .sec-done .title { font-weight: 400; }
.sec-done .title { color: var(--muted); }
@media (max-width: 480px) {
  h1 { font-size: 1.7rem; }
  .item { padding: 12px; gap: 10px; }
}
</style>

<main dir="rtl" lang="he">
  <header>
    <h1>יומן כוח התערבות</h1>
    <div class="updated">עודכן {{UPDATED}}</div>
  </header>
  {{SECTIONS}}
</main>
