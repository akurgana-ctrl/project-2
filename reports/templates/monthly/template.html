<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>כח התערבות · דוח פעילות {{MONTH}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&display=swap">
<style>
@page { size: 1920px 1080px; margin: 0; }
:root { --navy: #0E1F3D; --gold: #C9A23A; --paper: #F6F3EC; --ink: #0E1F3D; --muted: #667085; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--paper); }
body { font-family: 'Heebo', Arial, sans-serif; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
h1, h2, h3, p, span, div { unicode-bidi: plaintext; }
.page { width: 1920px; height: 1080px; direction: rtl; display: flex; overflow: hidden; }

.side { width: 580px; flex: none; background: var(--navy); color: #fff; padding: 72px 64px 56px; display: flex; flex-direction: column; position: relative; }
.side::before { content: ""; position: absolute; top: 0; right: 0; width: 12px; height: 100%; background: var(--gold); }
.side .org { font-size: 26px; font-weight: 700; color: var(--gold); letter-spacing: 2px; }
.side h1 { font-size: 92px; font-weight: 900; line-height: 1; margin-top: 22px; }
.side .month { font-size: 46px; font-weight: 300; color: #D7DDE9; margin-top: 14px; }
.side .rule { width: 120px; height: 5px; background: var(--gold); margin: 56px 0 48px; }
.kpi { display: flex; flex-direction: column; gap: 10px; padding: 30px 0; border-top: 1px solid #2B416B; }
.kpi:last-of-type { border-bottom: 1px solid #2B416B; }
.kpi .v { font-size: 92px; font-weight: 800; line-height: 1; color: var(--gold); letter-spacing: -1px; }
.kpi .l { font-size: 27px; color: #D7DDE9; }
.side .by { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
.side .by b { font-size: 28px; font-weight: 700; }
.side .by span { font-size: 20px; color: #9FAAC0; }

.main { flex: 1; padding: 64px 72px 56px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto; gap: 30px 44px; align-content: space-between; }
.cat:last-child:nth-child(odd) { grid-column: span 2; }
.cat { display: flex; flex-direction: column; gap: 16px; }
.cat .hd { display: flex; align-items: baseline; gap: 18px; padding-bottom: 14px; border-bottom: 3px solid var(--navy); }
.cat .n { font-size: 30px; font-weight: 900; color: var(--gold); }
.cat h3 { font-size: 34px; font-weight: 800; }
.items { display: flex; flex-direction: column; gap: 14px; }
.it { display: flex; gap: 16px; align-items: flex-start; }
.it .dot { flex: none; width: 12px; height: 12px; background: var(--gold); margin-top: 14px; }
.it .tx { display: flex; flex-direction: column; gap: 3px; }
.it .t { font-size: 27px; font-weight: 500; line-height: 1.3; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.it .d { font-size: 22px; color: var(--muted); line-height: 1.35; }
.pill { font-size: 19px; font-weight: 700; padding: 3px 14px; border: 2px solid var(--gold); color: #8A6A12; white-space: nowrap; }
</style>
</head>
<body>
<section class="page">
  <aside class="side">
    <p class="org">כח התערבות</p>
    <h1>דוח פעילות</h1>
    <p class="month">{{MONTH}}</p>
    <div class="rule"></div>
{{KPIS}}
    <div class="by"><span>{{SOURCE}}</span></div>
  </aside>

  <main class="main">
{{CATEGORIES}}
  </main>
</section>
</body>
</html>
