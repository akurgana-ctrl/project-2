<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>כח התערבות · דוח פעילות {{MONTH}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@200;300;400;500;700;800;900&display=swap">
<style>
@page { size: 1920px 1080px; margin: 0; }
:root { --navy: #0D1C38; --navy-2: #16294D; --gold: #C9A23A; --gold-2: #E2C676; --paper: #F5F1E8; --ink: #0D1C38; --muted: #6B7280; --rule: #DCD4C2; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--paper); }
body { font-family: 'Heebo', Arial, sans-serif; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
h1, h2, h3, p, span, div { unicode-bidi: plaintext; }
.page { width: 1920px; height: 1080px; direction: rtl; display: flex; flex-direction: column; overflow: hidden; }

/* top band */
.band { height: 300px; flex: none; background: var(--navy); color: #fff; display: flex; align-items: stretch; padding: 0 88px; position: relative; }
.band::after { content: ""; position: absolute; right: 0; left: 0; bottom: 0; height: 8px; background: var(--gold); }
.title { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.title .org { font-size: 28px; font-weight: 700; color: var(--gold); letter-spacing: 3px; }
.title h1 { font-size: 116px; font-weight: 900; line-height: 0.95; letter-spacing: -2px; }
.title .month { font-size: 46px; font-weight: 200; color: #D5DBE7; }
.kpis { display: flex; align-items: center; }
.kpi { display: flex; flex-direction: column; gap: 12px; padding: 0 64px; border-right: 1px solid #2E4370; }
.kpi:first-child { border-right: none; }
.kpi .v { font-size: 104px; font-weight: 800; line-height: 1; color: var(--gold); letter-spacing: -2px; }
.kpi .l { font-size: 28px; font-weight: 300; color: #D5DBE7; }

/* activity columns */
.cols { flex: 1; display: grid; grid-template-columns: repeat({{COLS}}, 1fr); padding: 40px 88px 0; min-height: 0; }
.col { padding: 0 34px; border-left: 1px solid var(--rule); display: flex; flex-direction: column; gap: 14px; }
.col:first-child { padding-right: 0; }
.col:last-child { border-left: none; padding-left: 0; }
.col .n { font-size: 64px; font-weight: 200; line-height: 0.9; color: var(--gold); letter-spacing: -2px; }
.col h3 { font-size: 36px; font-weight: 800; line-height: 1.15; padding-bottom: 12px; border-bottom: 4px solid var(--navy); }
.items { display: flex; flex-direction: column; }
.it { padding: 10px 0; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 4px; }
.it:last-child { border-bottom: none; }
.it .t { font-size: 29px; font-weight: 500; line-height: 1.25; }
.it .d { font-size: 23px; font-weight: 400; color: var(--muted); line-height: 1.3; }
.pill { display: inline-block; align-self: flex-start; margin-top: 6px; font-size: 20px; font-weight: 700; padding: 4px 14px; background: var(--gold); color: var(--navy); }

.foot { flex: none; padding: 14px 88px 28px; display: flex; justify-content: space-between; font-size: 20px; color: var(--muted); }
</style>
</head>
<body>
<section class="page">
  <header class="band">
    <div class="title">
      <p class="org">כח התערבות</p>
      <h1>דוח פעילות</h1>
      <p class="month">{{MONTH}}</p>
    </div>
    <div class="kpis">
{{KPIS}}
    </div>
  </header>

  <main class="cols">
{{CATEGORIES}}
  </main>

  <footer class="foot"><span>{{SOURCE}}</span><span>כח התערבות</span></footer>
</section>
</body>
</html>
